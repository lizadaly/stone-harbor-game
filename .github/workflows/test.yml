name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install
      run: |
        for dir in . es pt; do
          npm ci --prefix "$dir"
        done

    - name: Install browser
      run: npx playwright install --with-deps chromium

    - name: Test
      run: npm test
